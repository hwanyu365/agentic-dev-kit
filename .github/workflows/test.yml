name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx -y @anthropic-ai/claude-code@2.1.319 plugin validate .
      # merge-gate 검사는 코멘트 jq 필터를 실제 gh 로 돌린다 → gh 인증에 읽기 전용 job 토큰을 쓴다.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          readlink -f "$(command -v sh)" "$(command -v awk)"
          for t in tests/*.test.sh; do echo "== $t"; sh "$t" || exit 1; done
      # 템플릿 YAML 은 자리표시자 치환 전에도 파싱돼야 한다 (CLAUDE.md 수정 규칙).
      - run: |
          python3 -m pip install -q --break-system-packages pyyaml==6.0.3
          python3 -c "
          import glob, sys, yaml
          fs = glob.glob('plugins/adk/template/.github/**/*.yml', recursive=True)
          for f in fs: yaml.safe_load(open(f, encoding='utf-8'))
          print('yaml ok', len(fs))
          sys.exit(0 if fs else 1)
          "

  # 사용자 쪽 plugin update 는 version 으로 갱신을 판단하므로, 그 version 이 처음 main 에 들어온 커밋에 태그를 남긴다.
  tag:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 연달아 merge 된 run 이 동시에 같은 태그를 만들면 늦은 쪽이 422 로 실패한다.
    concurrency:
      group: tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # rebase merge·연속 push·실패한 run 뒤에는 GITHUB_SHA 가 version 을 바꾼 커밋이 아닐 수 있다.
      # --first-parent 가 없으면 merge commit 대신 main 에 없던 PR 브랜치 커밋을 고른다.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=plugins/adk/.claude-plugin/plugin.json
          v="v$(jq -r .version "$f")"
          echo "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version 을 읽지 못함: $v"; exit 1; }
          if gh api "repos/{owner}/{repo}/git/ref/tags/$v" >/dev/null 2>&1; then echo "$v exists"; exit 0; fi
          sha=$(git log -1 --format=%H --first-parent -G'"version"' -- "$f")
          [ -n "$sha" ] || { echo "version 을 바꾼 커밋을 찾지 못함"; exit 1; }
          gh api "repos/{owner}/{repo}/git/refs" -f ref="refs/tags/$v" -f sha="$sha"
          echo "$v created at $sha"
