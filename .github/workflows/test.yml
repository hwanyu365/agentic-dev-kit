name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx -y @anthropic-ai/claude-code@2.1.319 plugin validate .
      # 템플릿 YAML 은 자리표시자 치환 전에도 파싱돼야 한다 (CLAUDE.md 수정 규칙).
      - run: |
          python3 -m pip install -q --break-system-packages pyyaml==6.0.3
          python3 -c "
          import glob, sys, yaml
          fs = glob.glob('plugins/adk/template/.github/**/*.yml', recursive=True)
          for f in fs: yaml.safe_load(open(f, encoding='utf-8'))
          print('yaml ok', len(fs))
          sys.exit(0 if fs else 1)
          "

  # 템플릿의 셸·awk 는 적용 저장소의 OS 에서 돈다 → 기본 awk 가 다른 세 환경에서 같은 테스트를 돌린다.
  sh:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, awk: gawk }
          - { os: ubuntu-latest, awk: mawk }
          - { os: macos-latest, awk: bsd }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.awk == 'mawk'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mawk
          mkdir -p "$RUNNER_TEMP/bin" && ln -s "$(command -v mawk)" "$RUNNER_TEMP/bin/awk"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install -q pyyaml==6.0.3
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      # 기대한 awk 가 아니면 이 환경의 통과는 다른 awk 의 결과다
      - env:
          WANT: ${{ matrix.awk }}
        run: |
          a=$(command -v awk); readlink -f "$(command -v sh)" "$a" 2>/dev/null || echo "$a"
          v=$(awk --version 2>&1 | head -n 1; awk -W version 2>&1 | head -n 1)
          echo "$v"
          case "$WANT" in
            gawk) echo "$v" | grep -q 'GNU Awk' ;;
            mawk) echo "$v" | grep -q mawk ;;
            bsd) [ "$a" = /usr/bin/awk ] && ! echo "$v" | grep -qE 'GNU Awk|mawk' ;;
          esac || { echo "::error::기대한 awk($WANT)가 아님"; exit 1; }
      # merge-gate 검사는 코멘트 jq 필터를 실제 gh 로 돌린다 → gh 인증에 읽기 전용 job 토큰을 쓴다.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: for t in tests/*.test.sh; do echo "== $t"; sh "$t" || exit 1; done

  # 보안 경계 조건을 하나씩 지운 사본에서 테스트가 실패하는지 본다. 실행 권한 조건은 chmod 가 듣는 Linux 에서만 잡힌다.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: sh tests/mutation.sh . tests/mutations.tsv

  # version 을 올린 변경만 Claude Code 를 띄워 렌더한 틀을 확인한다 (tests/runtime.sh). 시험 저장소를 함께 쓰므로 한 번에 하나만 돈다.
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: runtime
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # main push 는 PR 에서 이미 확인한 head 다 → 같은 확인으로 사용량을 다시 쓰지 않는다
      - if: github.event_name != 'pull_request'
        run: echo "::notice::PR 에서 확인함 → 런타임 관문 건너뜀"
      - if: github.event_name == 'pull_request'
        run: npm install -g -q @anthropic-ai/claude-code@2.1.319 && python3 -m pip install -q --break-system-packages pyyaml==6.0.3
      - if: github.event_name == 'pull_request'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ADK_TEST_TOKEN: ${{ secrets.ADK_TEST_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: sh tests/runtime.sh "$BASE"

  # 필수 check 는 이 job 하나다 → 하위 job 이 늘어도 저장소 규칙을 바꾸지 않는다. 실패·취소·건너뜀은 모두 실패로 본다.
  test:
    if: always()
    needs: [checks, sh, mutation, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          R: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$R"
          for x in $R; do [ "$x" = success ] || { echo "::error::하위 job 결과 $x"; exit 1; }; done

  # 사용자 쪽 plugin update 는 version 으로 갱신을 판단하므로, 그 version 이 처음 main 에 들어온 커밋에 태그를 남긴다.
  tag:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 연달아 merge 된 run 이 동시에 같은 태그를 만들면 늦은 쪽이 422 로 실패한다.
    concurrency:
      group: tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # rebase merge·연속 push·실패한 run 뒤에는 GITHUB_SHA 가 version 을 바꾼 커밋이 아닐 수 있다.
      # --first-parent 가 없으면 merge commit 대신 main 에 없던 PR 브랜치 커밋을 고른다.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=plugins/adk/.claude-plugin/plugin.json
          v="v$(jq -r .version "$f")"
          echo "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version 을 읽지 못함: $v"; exit 1; }
          if gh api "repos/{owner}/{repo}/git/ref/tags/$v" >/dev/null 2>&1; then echo "$v exists"; exit 0; fi
          sha=$(git log -1 --format=%H --first-parent -G'"version"' -- "$f")
          [ -n "$sha" ] || { echo "version 을 바꾼 커밋을 찾지 못함"; exit 1; }
          gh api "repos/{owner}/{repo}/git/refs" -f ref="refs/tags/$v" -f sha="$sha"
          echo "$v created at $sha"
